apiVersion: csoc.js2.org/v1alpha1
kind: SpokeIdentity
metadata:
  name: example-dedicated
spec: {}
---
apiVersion: csoc.js2.org/v1alpha1
kind: SpokeEnvironmentConfig
metadata:
  name: example-dedicated
  namespace: spokeclusters-example-dedicated
spec:
  environment: example
  nodeCIDR: 10.20.0.0/24
  podCIDR: 192.168.0.0/16
  serviceCIDR: 10.96.0.0/12
  networkMTU: 1500
  enableDHCP: true
  portSecurityEnabled: true
---
apiVersion: csoc.js2.org/v1alpha1
kind: DedicatedSpokeNetwork
metadata:
  name: example-dedicated
  namespace: spokeclusters-example-dedicated
spec:
  description: Managed network attached to the existing allocation router
---
apiVersion: csoc.js2.org/v1alpha1
kind: SpokeKeypair
metadata:
  name: example-dedicated
  namespace: spokeclusters-example-dedicated
spec: {}
---
apiVersion: csoc.js2.org/v1alpha1
kind: SpokeCluster
metadata:
  name: example-dedicated
  namespace: spokeclusters-example-dedicated
