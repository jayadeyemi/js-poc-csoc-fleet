apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-app
  namespace: hello-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: hello-app}
  template:
    metadata:
      labels: {app: hello-app}
    spec:
      containers:
        - name: hello-app
          image: nginx:1.25-alpine
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
