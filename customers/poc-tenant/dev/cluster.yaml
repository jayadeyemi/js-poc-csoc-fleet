apiVersion: csoc.js2.org/v1alpha1
kind: SpokeCluster
metadata:
  name: poc-tenant-dev
  namespace: spokeclusters
spec:
  environment: dev
  provider: openstack
  infrastructure:
    cloudName: openstack
    imageID: 18895dd1-6e94-482b-9a62-9573328c7429
    sshKeyName: jetstream-CSOC-POC
  kubernetes:
    version: v1.34.8
    nodeClass: general              # m3.medium workers
    minNodes: 2
    maxNodes: 4
    podCIDR: "192.168.0.0/16"
    serviceCIDR: "10.96.0.0/12"
  controlPlane:
    count: 1
    flavor: m3.small
  network:
    connectivity: public
    nodeCIDR: "10.2.0.0/24"
    dnsNameserver: "8.8.8.8"
    externalNetworkID: 3fe22c05-6206-4db2-9a13-44f04b6796e6
    apiServerAllowedCIDR: "0.0.0.0/0"
  capabilities:
    security: false
    observability: false
  registration:
    enabled: true
    labels:
      csoc.js2.org/customer: poc-tenant
      csoc.js2.org/environment: dev
      csoc.js2.org/ownership: csoc
      csoc.js2.org/hello-csoc: enabled
