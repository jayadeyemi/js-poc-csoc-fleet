apiVersion: fleet.csoc.js2.org/v1alpha1
kind: FleetOwnershipRegistry
clusters:
  - name: test-poc-v2-dev
    account: test-poc
    owner: staging
    type: WorkloadCluster
    path: environments/staging/accounts/test-poc/hello-app/dev-v2
    activation: staging-candidate
applications:
  - account: test-poc
    app: hello-app
    environment: dev
    owner: staging
    type: SmokeApplication
    clusterRef: test-poc-v2-dev
    path: environments/staging/accounts/test-poc/hello-app/dev-v2/smoke
    activation: staging-candidate
  - account: test-poc
    app: jupyterhub
    environment: dev
    owner: staging
    type: JupyterHubInstance
    clusterRef: test-poc-v2-dev
    path: environments/staging/accounts/test-poc/hello-app/dev-v2/jupyterhub
    activation: staging-candidate
  - account: test-poc
    app: monitoring
    environment: dev
    owner: staging
    type: MonitoringInstance
    clusterRef: test-poc-v2-dev
    path: environments/staging/accounts/test-poc/hello-app/dev-v2/monitoring
    activation: staging-candidate
# Compatibility entries remain visible until their replacement instances pass
# staging acceptance. They are intentionally not part of the v2 ownership graph.
legacyAssignments:
  - account: test-poc
    app: hello-app
    environment: dev
    owner: staging
    path: environments/staging/accounts/test-poc/hello-app/dev
